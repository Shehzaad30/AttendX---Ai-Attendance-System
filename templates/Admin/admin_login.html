<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AttendX - Admin Secure Access</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #a855f7;
            --bg-base: #020617; /* Slate 950 */
            --bg-surface: #0f172a; /* Slate 900 */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-light: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(15, 23, 42, 0.4);
            --focus-ring: rgba(99, 102, 241, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Split Layout */
        .split-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* Left Side: Brand Showcase */
        .brand-section {
            flex: 1;
            position: relative;
            background: #0f172a;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            z-index: 1;
        }

        @media (max-width: 1024px) {
            .brand-section {
                display: none;
            }
        }

        /* Ambient Background in Brand Section */
        .brand-bg {
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%);
            z-index: -1;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            z-index: -1;
            animation: float 20s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(99, 102, 241, 0.3);
            top: 10%;
            left: 10%;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: rgba(168, 85, 247, 0.2);
            bottom: 10%;
            right: 10%;
            animation-delay: -5s;
        }

        /* Glass Floating Feature Card */
        .feature-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 2rem;
            max-width: 500px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 1s ease-out;
        }

        .feature-card h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .feature-card p {
            color: var(--text-muted);
            font-size: 1.125rem;
            line-height: 1.6;
        }

        /* Right Side: Login Form */
        .form-section {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2rem 2.5rem;
            background: var(--bg-base);
            position: relative;
            z-index: 2;
            box-shadow: -20px 0 50px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 1024px) {
            .form-section {
                max-width: 100%;
                align-items: center;
            }
        }

        .form-wrapper {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            animation: fadeIn 0.8s ease-out;
        }

        .logo-header {
            margin-bottom: 2rem;
        }

        .logo-header img {
            width: 160px;
            height: auto;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .logo-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }

        .logo-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.875rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        .form-group {
            margin-bottom: 1rem;
            position: relative;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1.25rem;
            color: #64748b;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 10;
        }

        .form-control {
            width: 100%;
            padding: 1rem 1.25rem 1rem 3.25rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: transparent;
        }

        .floating-label {
            position: absolute;
            left: 3.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1rem;
            transition: all 0.2s ease;
            pointer-events: none;
            background: var(--bg-base);
            padding: 0 0.25rem;
        }

        .form-control:focus,
        .form-control:not(:placeholder-shown) {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .form-control:focus + .floating-label,
        .form-control:not(:placeholder-shown) + .floating-label {
            top: 0;
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 500;
        }

        .form-control:focus ~ .input-icon,
        .form-control:not(:placeholder-shown) ~ .input-icon {
            color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            padding: 1.125rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.5);
        }

        .btn-submit:hover::before {
            opacity: 1;
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            font-size: 0.875rem;
        }

        .checkbox-custom {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        .checkbox-custom input {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #64748b;
            border-radius: 5px;
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .checkbox-custom input:checked {
            background: var(--primary);
            border-color: var(--primary);
        }

        .checkbox-custom input:checked::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            color: white;
            font-size: 10px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            margin-top: 1.5rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--text-main);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 50px); }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

    </style>
</head>

<body>
    <div class="split-layout">
        
        <!-- Brand / Graphic Section (Left) -->
        <div class="brand-section">
            <div class="brand-bg"></div>
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            
            <div class="feature-card">
                <h2>Welcome to AttendX-Admin Portal</h2>
                <p>Manage attendance, track real-time analytics, and oversee your entire institutional hierarchy with precision and scale.</p>
            </div>
        </div>

        <!-- Form Section (Right) -->
        <div class="form-section">
            <div class="form-wrapper">
                
                <div class="logo-header">
                    <img src="{{ url_for('static', filename='Admin/assets/img/logo-removebg-preview.png') }}" style="width: auto; height: 150px;" alt="AttendX Logo" onerror="this.style.display='none'">
                    <h1>Admin Portal</h1>
                    <p>Enter your credentials to securely access your workspace.</p>
                </div>

                {% if error %}
                <div class="alert-error">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <form method="post" action="{{ url_for('alogin_process') }}">
                    
                    <div class="form-group">
                        <div class="input-wrapper">
                            <input type="email" name="admin_email" class="form-control" placeholder="Email Address" required autocomplete="email">
                            <label class="floating-label">Email Address</label>
                            <i class="fas fa-envelope input-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="input-wrapper">
                            <input type="password" id="password" name="admin_pass" class="form-control" placeholder="Password" required autocomplete="current-password">
                            <label class="floating-label">Password</label>
                            <i class="fas fa-lock input-icon"></i>
                        </div>
                    </div>

                    <div class="options-row">
                        <label class="checkbox-custom">
                            <input type="checkbox" id="showPassword" onclick="togglePassword()">
                            <span>Reveal Password</span>
                        </label>
                    </div>

                    <button type="submit" class="btn-submit">
                        Secure Sign In <i class="fas fa-arrow-right"></i>
                    </button>
                    
                </form>

                <a href="{{ url_for('faculty_login') }}" class="back-link">
                    <i class="fas fa-arrow-left"></i> Switch to Faculty Portal
                </a>
                
            </div>
        </div>

    </div>

    <script>
        function togglePassword() {
            var passwordField = document.getElementById("password");
            if (passwordField.type === "password") {
                passwordField.type = "text";
            } else {
                passwordField.type = "password";
            }
        }
    </script>
</body>
</html>
