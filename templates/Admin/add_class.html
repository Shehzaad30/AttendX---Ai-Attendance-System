{% extends "Admin/layout.html" %}
{% block content %}

<style>
    .elite-form-card {
        background: #f9fafb;
        border-radius: var(--radius-lg);
        border: 1px solid rgba(0, 0, 0, 0.05);
        box-shadow: var(--shadow-premium);
        overflow: hidden;
        margin-bottom: 30px;
    }

    .elite-card-header {
        padding: 20px 25px;
        background: rgba(0, 0, 0, 0.02);
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .elite-card-header h3 {
        font-size: 1.1rem;
        font-weight: 800;
        margin: 0;
        color: var(--text-main);
        letter-spacing: -0.5px;
    }

    .elite-card-body {
        padding: 30px;
    }

    .form-group-elite label {
        display: block;
        font-weight: 700;
        font-size: 0.8rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
    }

    .form-control-elite {
        width: 100%;
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text-main);
        transition: var(--transition);
        margin-bottom: 25px;
    }

    .form-control-elite:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        outline: none;
    }

    .submit-btn-elite {
        background: #1e293b;
        color: #fff;
        border: none;
        border-radius: 14px;
        padding: 16px;
        width: 100%;
        font-weight: 800;
        font-size: 1rem;
        letter-spacing: 0.5px;
        transition: var(--transition);
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        margin-top: 10px;
    }

    .submit-btn-elite:hover {
        background: var(--primary);
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 15px 35px rgba(99, 102, 241, 0.2);
    }

    .elite-header-box {
        width: 50px;
        height: 50px;
        background: #fff;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        color: var(--primary);
        box-shadow: var(--shadow-premium);
        margin-right: 20px;
    }

    .breadcrumb-elite {
        display: flex;
        gap: 10px;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--text-muted);
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .breadcrumb-elite a { color: var(--primary); text-decoration: none; }
</style>

<div class="main-content">
    <section class="section">
        <!-- Page Header -->
        <div class="mb-5">
            <div class="breadcrumb-elite">
                <a href="{{url_for('dashboard')}}">DASHBOARD</a> 
                <span>/</span> 
                <a href="{{url_for('view_class')}}">CLASSES</a> 
                <span>/</span> 
                <span class="text-main">SCHEDULING</span>
            </div>
            <div class="d-flex align-items-center">
                <div class="elite-header-box">
                    <i class="fas fa-plus-circle"></i>
                </div>
                <div>
                    <h1 class="text-main font-weight-800 mb-0" style="font-size: 1.8rem; letter-spacing: -1px;">Schedule Class</h1>
                    <p class="text-muted mb-0 font-weight-500">Establishing new academic parameters for the <span class="text-primary font-weight-700">AttendX</span> grid</p>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-10 offset-lg-1">
                <div class="elite-form-card">
                    <div class="elite-card-header">
                        <i class="fas fa-door-open text-primary"></i>
                        <h3>Session Configuration</h3>
                    </div>
                    <form action="{{url_for('insert_class')}}" method="post">
                        <div class="elite-card-body">
                            <div class="row">
                                <div class="col-md-6 form-group-elite">
                                    <label>Class Name</label>
                                    <input type="text" name="class_name" class="form-control-elite" placeholder="Operating Systems Lab" required>
                                </div>
                                <div class="col-md-6 form-group-elite">
                                    <label>Faculty Incharge</label>
                                    <select class="form-control-elite" name="Faculty_id" required>
                                        <option value="">Select Faculty</option>
                                        {% for faculty in faculty_members %}
                                        <option value="{{ faculty[0] }}">{{ faculty[1] }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4 form-group-elite">
                                    <label>Semester</label>
                                    <select class="form-control-elite" name="semester" required>
                                        <option value="">Select Semester</option>
                                        {% for i in range(1, 9) %}
                                        <option value="{{i}}">Semester {{i}}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-4 form-group-elite">
                                    <label>Department</label>
                                    <select class="form-control-elite" name="Department_id" required>
                                        <option value="">Select Department</option>
                                        {% for dep in departments %}
                                        <option value="{{ dep[0] }}">{{ dep[1] }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-4 form-group-elite">
                                    <label>Room Number</label>
                                    <input type="text" name="room_no" class="form-control-elite" placeholder="Lab-104" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4 form-group-elite">
                                    <label>Session Date</label>
                                    <input type="date" name="date" class="form-control-elite">
                                </div>
                                <div class="col-md-4 form-group-elite">
                                    <label>Activation Time</label>
                                    <input type="time" name="start_time" class="form-control-elite">
                                </div>
                                <div class="col-md-4 form-group-elite">
                                    <label>Termination Time</label>
                                    <input type="time" name="end_time" class="form-control-elite">
                                </div>
                            </div>

                            <button type="submit" class="submit-btn-elite">
                                <i class="fas fa-calendar-check mr-2"></i> SCHEDULE SESSION
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</div>
{% endblock %}
