{% extends "Admin/layout.html" %}
{% block content %}

<style>
    .elite-form-card {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.3);

        box-shadow:
            0 10px 30px rgba(0, 0, 0, 0.08),
            inset 0 1px 0 rgba(255, 255, 255, 0.6);

        border-radius: 20px;
    }

    .elite-card-header {
        padding: 20px 25px;
        background: rgba(0, 0, 0, 0.02);
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .elite-card-header h3 {
        font-size: 1.1rem;
        font-weight: 800;
        margin: 0;
        color: var(--text-main);
        letter-spacing: -0.5px;
    }

    .elite-card-body {
        padding: 30px;
    }

    .form-group-elite label {
        display: block;
        font-weight: 700;
        font-size: 0.8rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
    }

    .form-control-elite {
        width: 100%;
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text-main);
        transition: var(--transition);
        margin-bottom: 25px;
    }

    .form-control-elite:focus {
        border-color: #f59e0b;
        box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.1);
        outline: none;
    }

    .submit-btn-elite {
        background: #1e293b;
        color: #fff;
        border: none;
        border-radius: 14px;
        padding: 16px;
        width: 100%;
        font-weight: 800;
        font-size: 1rem;
        letter-spacing: 0.5px;
        transition: var(--transition);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        margin-top: 10px;
    }

    .submit-btn-elite:hover {
        background: #f59e0b;
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 15px 35px rgba(245, 158, 11, 0.2);
    }

    .elite-header-box {
        width: 50px;
        height: 50px;
        background: #fff;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        color: #f59e0b;
        box-shadow: var(--shadow-premium);
        margin-right: 20px;
    }

    .breadcrumb-elite {
        display: flex;
        gap: 10px;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--text-muted);
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .breadcrumb-elite a {
        color: var(--primary);
        text-decoration: none;
    }
</style>

<div class="main-content">
    <section class="section">
        <!-- Page Header -->
        <div class="mb-5">
            <div class="breadcrumb-elite">
                <a href="{{url_for('dashboard')}}">DASHBOARD</a>
                <span>/</span>
                <a href="{{url_for('view_faculty')}}">FACULTY</a>
                <span>/</span>
                <span class="text-main">ADD FACULTY</span>
            </div>
            <div class="d-flex align-items-center">
                <div class="elite-header-box">
                    <i class="fas fa-user-plus"></i>
                </div>
                <div>
                    <h1 class="text-main font-weight-800 mb-0" style="font-size: 1.8rem; letter-spacing: -1px;">Add
                        Faculty</h1>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-6 offset-lg-3">
                <div class="elite-form-card">
                    <div class="elite-card-header">
                        <i class="fas fa-shield-alt text-warning"></i>
                        <h3>Add Faculty</h3>
                    </div>
                    <form action="{{url_for('insert_faculty')}}" method="post">
                        <div class="elite-card-body">
                            <div class="row">
                                <div class="col-md-6 form-group-elite">
                                    <label>Full Name</label>
                                    <input type="text" name="Faculty_name" class="form-control-elite"
                                        placeholder="Enter full name" required>
                                </div>
                                <div class="col-md-6 form-group-elite">
                                    <label>Institutional Email</label>
                                    <input type="email" name="Faculty_email" class="form-control-elite"
                                        placeholder="Enter email" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 form-group-elite">
                                    <label>Security Key</label>
                                    <input type="password" name="Password" class="form-control-elite"
                                        placeholder="••••••••" required minlength="6">
                                </div>
                                <div class="col-md-6 form-group-elite">
                                    <label>Department</label>
                                    <select class="form-control-elite" name="Department_id" required>
                                        <option value="">Select Department</option>
                                        {% for department in departments %}
                                        <option value="{{ department[0] }}">{{ department[1] }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 form-group-elite">
                                    <label>Contact</label>
                                    <input type="text" name="contact" class="form-control-elite"
                                        placeholder="+91 XXXXXXXXXX" required pattern="[0-9]{10}"
                                        title="Please enter a valid 10-digit phone number">
                                </div>
                                <div class="col-md-6 form-group-elite">
                                    <label>Identity Image</label>
                                    <input type="file" name="Faculty_image" class="form-control-elite">
                                </div>
                            </div>
                            <button type="submit" class="submit-btn-elite">
                                <i class="fas fa-user-shield mr-2"></i> Add Faculty
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</div>

{% endblock %}
