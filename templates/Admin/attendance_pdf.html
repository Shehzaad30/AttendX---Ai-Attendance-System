{% extends "Admin/layout.html" %}
{% block content %}
<style>
    body {
        font-family: Arial, sans-serif;
        padding: 30px;
    }

    h2 {
        text-align: center;
        color: #6c5ce7;
    }

    .info {
        margin-bottom: 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        background-color: #6c5ce7;
        color: white;
        padding: 10px;
    }

    td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: center;
    }
</style>
</head>

<body>

    <h2>Attendance Report</h2>

    <div class="info">
        <p><b>Name:</b> {{ data[0][0] }}</p>
        <p><b>Enrollment:</b> {{ data[0][1] }}</p>
        <p><b>Department:</b> {{ data[0][2] }}</p>
        <p><b>Semester:</b> {{ data[0][3] }}</p>
    </div>

    <table>
        <tr>
            <th>Date</th>
            <th>Status</th>
        </tr>

        {% for row in data %}
        <tr>
            <td>{{ row[4] }}</td>
            <td>{{ row[5] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
{% endblock %}
