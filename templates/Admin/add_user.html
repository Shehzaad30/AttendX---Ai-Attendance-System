{% extends "Admin/layout.html" %}
{% block content %}

<style>
    .elite-form-card {
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius-lg);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
        overflow: hidden;
        margin-bottom: 30px;
    }

    .elite-card-header {
        padding: 20px 25px;
        background: rgba(0, 0, 0, 0.02);
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .elite-card-header h3 {
        font-size: 1.1rem;
        font-weight: 800;
        margin: 0;
        color: var(--text-main);
        letter-spacing: -0.5px;
    }

    .elite-card-body {
        padding: 30px;
    }

    .form-group-elite label {
        display: block;
        font-weight: 700;
        font-size: 0.8rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
    }

    .form-control-elite {
        width: 100%;
        padding: 12px 18px;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text-main);
        margin-bottom: 25px;
    }

    .webcam-pannel {
        background: #0f172a;
        border-radius: 20px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        margin-bottom: 20px;
        aspect-ratio: 4/3;
    }

    .webcam-overlay {
        position: absolute;
        inset: 0;
        border: 2px dashed rgba(255, 255, 255, 0.3);
        margin: 40px;
        border-radius: 20px;
        pointer-events: none;
        z-index: 10;
    }

    .capture-btn {
        background: var(--primary-gradient);
        color: #fff;
        border: none;
        border-radius: 14px;
        padding: 14px;
        width: 100%;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: var(--transition);
        box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2);
    }

    .capture-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 30px rgba(79, 70, 229, 0.3);
    }

    .submit-btn-elite {
        background: #1e293b;
        color: #fff;
        border: none;
        border-radius: 14px;
        padding: 16px;
        width: 100%;
        font-weight: 800;
        font-size: 1rem;
        letter-spacing: 0.5px;
        transition: var(--transition);
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        margin-top: 10px;
    }

    .submit-btn-elite:hover {
        background: var(--primary);
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 15px 35px rgba(99, 102, 241, 0.2);
    }

    .preview-thumbnail {
        width: 100px;
        height: 100px;
        border-radius: 12px;
        object-fit: cover;
        border: 2px solid #fff;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        margin-top: 15px;
    }

    .elite-header-box {
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        width: 50px;
        height: 50px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        color: var(--primary);
        box-shadow: var(--glass-shadow);
        margin-right: 20px;
        border: 1px solid var(--glass-border);
    }

    .breadcrumb-elite {
        display: flex;
        gap: 10px;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--text-muted);
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .breadcrumb-elite a { color: var(--primary); text-decoration: none; }
</style>

<div class="main-content">
    <section class="section">
        <!-- Page Header -->
        <div class="mb-5">
            <div class="breadcrumb-elite">
                <a href="{{url_for('dashboard')}}">DASHBOARD</a> 
                <span>/</span> 
                <a href="{{url_for('view_user')}}">STUDENTS</a> 
                <span>/</span> 
                <span class="text-main">REGISTRATION</span>
            </div>
            <div class="d-flex align-items-center">
                <div class="elite-header-box">
                    <i class="fas fa-user-plus"></i>
                </div>
                <div>
                    <h1 class="text-main font-weight-800 mb-0" style="font-size: 1.8rem; letter-spacing: -1px;">Identity Provisioning</h1>
                    <p class="text-muted mb-0 font-weight-500">Establishing high-fidelity biometric registration for <span class="text-primary font-weight-700">AttendX</span></p>
                </div>
            </div>
        </div>

        <form id="studentform" enctype="multipart/form-data">
            <div class="row">
                <!-- Biometric Capture -->
                <div class="col-lg-5">
                    <div class="elite-form-card">
                        <div class="elite-card-header">
                            <i class="fas fa-fingerprint text-primary"></i>
                            <h3>Biometric Node</h3>
                        </div>
                        <div class="elite-card-body">
                            <div class="webcam-pannel">
                                <video id="webcam" autoplay style="width: 100%; height: 100%; object-fit: cover;"></video>
                                <div class="webcam-overlay"></div>
                            </div>
                            <button type="button" id="capture" class="capture-btn">
                                <i class="fas fa-camera"></i> CAPTURE IDENTITY
                            </button>
                            <canvas id="canvas" style="display:none;"></canvas>
                            <div class="text-center">
                                <img src="" alt="" id="captured-image" class="preview-thumbnail" style="display:none;">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Registration Details -->
                <div class="col-lg-7">
                    <div class="elite-form-card">
                        <div class="elite-card-header">
                            <i class="fas fa-id-card text-primary"></i>
                            <h3>Entity Parameters</h3>
                        </div>
                        <div class="elite-card-body">
                            <div class="row">
                                <div class="col-md-6 form-group-elite">
                                    <label>Full Identity Name</label>
                                    <input type="text" class="form-control-elite" name="student_name" id="student_name" placeholder="John Doe" required>
                                </div>
                                <div class="col-md-6 form-group-elite">
                                    <label>Sector / Division</label>
                                    <select class="form-control-elite" name="Division" id="Division" required>
                                        <option value="">Select Sector</option>
                                        <option>Division A</option>
                                        <option>Division B</option>
                                        <option>Division C</option>
                                        <option>Division D</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 form-group-elite">
                                    <label>Enrollment Protocol</label>
                                    <input type="text" class="form-control-elite" name="Enrollment_no" id="Enrollment_no" placeholder="AX-99201" required>
                                </div>
                                <div class="col-md-6 form-group-elite">
                                    <label>Assigned Department</label>
                                    <select class="form-control-elite" name="Department_id" id="Department_id" required>
                                        <option value="">Select Domain</option>
                                        {% for department in departments %}
                                        <option value="{{ department[0] }}">{{ department[1] }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 form-group-elite">
                                    <label>Academic Season</label>
                                    <input type="text" class="form-control-elite" name="Semester" id="Semester" placeholder="Semester 1" required>
                                </div>
                                <div class="col-md-6 form-group-elite">
                                    <label>Communications Email</label>
                                    <input type="email" class="form-control-elite" name="Email" id="Email" placeholder="entity@attendx.ai" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 form-group-elite">
                                    <label>Security Key</label>
                                    <input type="password" class="form-control-elite" name="password" id="password" required placeholder="••••••••" minlength="6">
                                </div>
                                <div class="col-md-6 form-group-elite">
                                    <label>Contact Node</label>
                                    <input type="text" class="form-control-elite" name="contact" id="contact" required pattern="[0-9]{10}" placeholder="+91 XXXXXXXXXX">
                                </div>
                            </div>
                            
                            <input type="file" name="captured_image" id="captured_image" style="display:none;">
                            <button class="submit-btn-elite" type="button" id="submitBtn">
                                <i class="fas fa-shield-check mr-2"></i> INITIALIZE REGISTRATION
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </section>
</div>

<script>
    const webcam = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const captureButton = document.getElementById('capture');
    const capturedImageInput = document.getElementById('captured_image');
    const submitButton = document.getElementById('submitBtn');
    const preview = document.getElementById('captured-image');

    async function startWebcam() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            webcam.srcObject = stream;
        } catch (err) {
            console.log("Webcam error:", err);
            alert("Security clearance for camera denied.");
        }
    }

    startWebcam();

    captureButton.addEventListener("click", function () {
        canvas.width = webcam.videoWidth;
        canvas.height = webcam.videoHeight;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);
        const imageData = canvas.toDataURL("image/png");
        preview.src = imageData;
        preview.style.display = "inline-block";
        fetch(imageData)
            .then(res => res.blob())
            .then(blob => {
                const file = new File([blob], "student_entity.png", { type: "image/png" });
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);
                capturedImageInput.files = dataTransfer.files;
            });
    });

    submitButton.addEventListener("click", function (e) {
        e.preventDefault();
        const form = document.getElementById("studentform");
        const formData = new FormData(form);

        if (!capturedImageInput.files.length) {
            alert("Please capture biometric identity first.");
            return;
        }

        fetch("{{ url_for('studentprocess') }}", {
            method: "POST",
            body: formData
        })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    Toastify({
                        text: "Identity Protocol Established Successfully",
                        duration: 3000,
                        gravity: "top",
                        position: "right",
                        style: { background: "linear-gradient(to right, #00b09b, #96c93d)" }
                    }).showToast();
                    window.location.href = "{{url_for('view_user')}}";
                } else {
                    Toastify({
                        text: data.message,
                        duration: 3000,
                        gravity: "top",
                        position: "right",
                        style: { background: "#ef4444" }
                    }).showToast();
                }
            })
            .catch(error => console.log(error));
    });
</script>

{% endblock %}
