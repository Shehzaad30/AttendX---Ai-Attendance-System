{% extends "Admin/layout.html" %}
{% block content %}

<style>
    .elite-form-card {
        background: #f9fafb;
        border-radius: var(--radius-lg);
        border: 1px solid rgba(0, 0, 0, 0.05);
        box-shadow: var(--shadow-premium);
        overflow: hidden;
        margin-bottom: 30px;
    }

    .elite-card-header {
        padding: 20px 25px;
        background: rgba(0, 0, 0, 0.02);
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .elite-card-header h3 {
        font-size: 1.1rem;
        font-weight: 800;
        margin: 0;
        color: var(--text-main);
        letter-spacing: -0.5px;
    }

    .elite-card-body {
        padding: 30px;
    }

    .form-group-elite label {
        display: block;
        font-weight: 700;
        font-size: 0.8rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
    }

    .form-control-elite {
        width: 100%;
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text-main);
        transition: var(--transition);
        margin-bottom: 25px;
    }

    .form-control-elite:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        outline: none;
    }

    .save-btn-elite {
        background: var(--primary-gradient);
        color: #fff;
        border: none;
        border-radius: 14px;
        padding: 16px;
        width: 100%;
        font-weight: 800;
        font-size: 1rem;
        letter-spacing: 0.5px;
        transition: var(--transition);
        box-shadow: 0 10px 25px rgba(79, 70, 229, 0.2);
        margin-top: 10px;
    }

    .save-btn-elite:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 15px 35px rgba(99, 102, 241, 0.3);
    }

    .elite-header-box {
        width: 50px;
        height: 50px;
        background: #fff;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        color: var(--primary);
        box-shadow: var(--shadow-premium);
        margin-right: 20px;
    }

    .breadcrumb-elite {
        display: flex;
        gap: 10px;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--text-muted);
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .breadcrumb-elite a { color: var(--primary); text-decoration: none; }
</style>

<div class="main-content">
    <section class="section">
        <!-- Page Header -->
        <div class="mb-5">
            <div class="breadcrumb-elite">
                <a href="{{url_for('dashboard')}}">DASHBOARD</a> 
                <span>/</span> 
                <a href="{{url_for('view_user')}}">STUDENTS</a> 
                <span>/</span> 
                <span class="text-main">MODIFICATION</span>
            </div>
            <div class="d-flex align-items-center">
                <div class="elite-header-box">
                    <i class="fas fa-user-edit"></i>
                </div>
                <div>
                    <h1 class="text-main font-weight-800 mb-0" style="font-size: 1.8rem; letter-spacing: -1px;">Modify Entity</h1>
                    <p class="text-muted mb-0 font-weight-500">Updating parameters for student <span class="text-primary font-weight-700">{{student[1]}}</span></p>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-8 offset-lg-2">
                <div class="elite-form-card">
                    <div class="elite-card-header">
                        <i class="fas fa-sliders-h text-primary"></i>
                        <h3>Configurable Parameters</h3>
                    </div>
                    <form action="{{url_for('edit_user_process', Student_id=student[0])}}" method="post" enctype="multipart/form-data">
                        <div class="elite-card-body">
                            <div class="row">
                                <div class="col-md-12 form-group-elite">
                                    <label>Identity Name</label>
                                    <input type="text" class="form-control-elite" name="student_name" value="{{student[1]}}">
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 form-group-elite">
                                    <label>Sector / Division</label>
                                    <select class="form-control-elite" name="Division">
                                        <option value="">Select Sector</option>
                                        <option value="Division A" {% if student[2]=="Division A" %}selected{% endif %}>Division A</option>
                                        <option value="Division B" {% if student[2]=="Division B" %}selected{% endif %}>Division B</option>
                                        <option value="Division C" {% if student[2]=="Division C" %}selected{% endif %}>Division C</option>
                                        <option value="Division D" {% if student[2]=="Division D" %}selected{% endif %}>Division D</option>
                                    </select>
                                </div>
                                <div class="col-md-6 form-group-elite">
                                    <label>Enrollment Protocol</label>
                                    <input type="text" class="form-control-elite" name="Enrollment_no" value="{{student[3]}}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 form-group-elite">
                                    <label>Assigned Domain</label>
                                    <select class="form-control-elite" name="Department_id">
                                        <option value="">Select Domain</option>
                                        {% for department in departments %}
                                        <option value="{{ department[0] }}" {% if department[0]==student[4] %}selected{% endif %}>
                                            {{ department[1] }}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-6 form-group-elite">
                                    <label>Academic Season</label>
                                    <input type="text" class="form-control-elite" name="Semester" value="{{student[5]}}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-12 form-group-elite">
                                    <label>Contact Node</label>
                                    <input type="text" class="form-control-elite" name="contact" required pattern="[0-9]{10}" value="{{student[8]}}">
                                </div>
                            </div>

                            <button class="save-btn-elite">
                                <i class="fas fa-save mr-2"></i> LEGACY PERSISTENCE: SAVE CHANGES
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</div>
{% endblock %}
